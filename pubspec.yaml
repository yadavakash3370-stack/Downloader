name: videograb
description: "VideoGrab - multi-platform video downloader, player and in-app study browser (YouTube, Instagram, Facebook, TikTok, X, Vimeo, Dailymotion, Physics Wallah and 1000+ sites)."
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17
  video_player: ^2.9.2
  webview_flutter: ^4.8.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
