org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# Lite APK: set to false (drops the ~35 MB ffmpeg natives). CI toggles this line.
videograb.withFfmpeg=true
# ABI packed into the APK: arm64-v8a, armeabi-v7a, x86_64
videograb.abi=arm64-v8a
