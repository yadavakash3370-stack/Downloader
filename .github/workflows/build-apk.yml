name: Build APK

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build VideoGrab APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Point Gradle to the Flutter SDK
        run: |
          FLUTTER_SDK="$(dirname "$(dirname "$(command -v flutter)")")"
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> android/local.properties

      # Analyzer findings are published as annotations, so they can be read
      # from the Checks API. The test and build steps decide pass/fail.
      - name: Static analysis (report only)
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          tail -n 40 analyze.log
          annotate() {
            # annotate <error|warning|notice> <title> <text>
            [ -n "$3" ] || return 0
            msg="$(printf '%s' "$3" | head -c 3800 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            echo "::$1 title=$2::${msg}"
          }
          annotate error "flutter analyze: errors" "$(grep -E '^[[:space:]]*error •' analyze.log | head -n 30)"
          annotate warning "flutter analyze: warnings" "$(grep -E '^[[:space:]]*warning •' analyze.log | head -n 30)"
          annotate notice "flutter analyze: infos" "$(grep -E '^[[:space:]]*info •' analyze.log | head -n 30)"
          exit 0

      # PW account client against a local stand-in server (no real network).
      - name: Unit tests
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee test.log
          echo "::notice title=unit tests::$(tail -n 1 test.log | cut -c1-200)"

      # ---------------------------------------------------------------- LITE
      # ~25 MB: no ffmpeg natives (single-file formats, no merging).
      - name: Build LITE APK (arm64)
        run: |
          set -eo pipefail
          sed -i '/videograb.withFfmpeg/d;/videograb.abi/d' android/gradle.properties
          printf "videograb.withFfmpeg=false\nvideograb.abi=arm64-v8a\n" >> android/gradle.properties
          rm -rf build/app/outputs build/app/intermediates/merged_native_libs
          flutter build apk --release --target-platform android-arm64 2>&1 | tee build-lite-arm64.log
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/VideoGrab-lite-arm64-v8a.apk
          ls -lh dist

      - name: Build LITE APK (armv7 / old phones)
        run: |
          set -eo pipefail
          sed -i '/videograb.withFfmpeg/d;/videograb.abi/d' android/gradle.properties
          printf "videograb.withFfmpeg=false\nvideograb.abi=armeabi-v7a\n" >> android/gradle.properties
          rm -rf build/app/outputs build/app/intermediates/merged_native_libs
          flutter build apk --release --target-platform android-arm 2>&1 | tee build-lite-armv7.log
          cp build/app/outputs/flutter-apk/app-release.apk dist/VideoGrab-lite-armeabi-v7a.apk
          ls -lh dist

      # ---------------------------------------------------------------- FULL
      # ~58 MB: bundled ffmpeg (best-video + best-audio merging, audio->m4a).
      - name: Build FULL APK (arm64 + ffmpeg)
        run: |
          set -eo pipefail
          sed -i '/videograb.withFfmpeg/d;/videograb.abi/d' android/gradle.properties
          printf "videograb.withFfmpeg=true\nvideograb.abi=arm64-v8a\n" >> android/gradle.properties
          rm -rf build/app/outputs build/app/intermediates/merged_native_libs
          flutter build apk --release --target-platform android-arm64 2>&1 | tee build-full-arm64.log
          cp build/app/outputs/flutter-apk/app-release.apk dist/VideoGrab-full-arm64-v8a.apk
          ls -lh dist

      - name: Report build errors
        if: failure()
        run: |
          set +e
          annotate() {
            # annotate <title> <text>
            [ -n "$2" ] || return 0
            msg="$(printf '%s' "$2" | head -c 3800 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=$1::${msg}"
          }
          if [ -f test.log ] && grep -qE '\[E\]|Some tests failed|Compilation failed' test.log; then
            annotate "unit tests: failures" "$(grep -A 16 -F '[E]' test.log | cut -c1-240 | head -n 120)"
            annotate "unit tests: compile errors" "$(grep -E 'Error:|error •' test.log | cut -c1-240 | head -n 30)"
            annotate "unit tests: summary" "$(tail -n 12 test.log | cut -c1-240)"
          fi
          for f in build-*.log; do
            [ -f "$f" ] || continue
            errors="$(grep -E '^e: |^lib/.*[0-9]+:[0-9]+: Error|[Ee]rror:|FAILURE|What went wrong|Unresolved reference|Could not (resolve|find)' "$f" | head -n 40)"
            [ -n "$errors" ] || errors="$(tail -n 25 "$f")"
            annotate "$f" "$errors"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: videograb-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Direct download buttons for phones (Releases page).
      - name: Publish APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: VideoGrab - latest APK
          make_latest: true
          body: |
            ## VideoGrab APK

            | File | Size | Kab chunein |
            | --- | --- | --- |
            | `VideoGrab-full-arm64-v8a.apk` | ~65 MB | **Recommended** - har quality (merge + audio conversion) |
            | `VideoGrab-lite-arm64-v8a.apk` | ~30 MB | Chhoti size, single-file formats (720p tak) |
            | `VideoGrab-lite-armeabi-v7a.apk` | ~29 MB | Purane 32-bit phones |

            Install: APK download karein -> "Unknown sources" allow karein -> install.

            Is build me: **PW account login** (app ke andar OTP ya PW website
            login), PW lecture link ko account se kholna, PW tab me lectures
            fullscreen player ke saath, instant platform detection, fast
            downloads (Settings me 1x-16x).

            Fix (1.2.1): PW website par number wale box par tap karne se
            "Webpage not available / ERR_UNKNOWN_URL_SCHEME" (Truecaller link)
            ab nahi aata.

            Note: DRM-protected PW lectures download nahi hote - wo PW tab ke
            official player me chalte hain.

            Pehli launch par engine setup hota hai (10-20s). Extractor tootne par
            Settings -> Update engine.
          files: dist/*.apk
          fail_on_unmatched_files: true
