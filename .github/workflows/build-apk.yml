name: Build APK

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build VideoGrab APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Point Gradle to the Flutter SDK
        run: |
          FLUTTER_SDK="$(dirname "$(dirname "$(command -v flutter)")")"
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> android/local.properties
          cat android/local.properties

      - name: Build release APK (per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build release APK (universal, arm + arm64)
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/*.apk dist/
          ls -lh dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: videograb-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach APKs to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
